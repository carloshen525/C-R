<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="projBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="foodAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5E3A" />
    </linearGradient>
    <filter id="pShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect width="480" height="300" rx="14" fill="url(#projBg3)" />
  <circle cx="240" cy="150" r="130" fill="#0A84FF" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Smartphone Central com Cardápio Digital -->
  <g transform="translate(170, 15)" filter="url(#pShadow3)">
    <rect x="0" y="0" width="140" height="270" rx="24" fill="#181D26" stroke="#364254" stroke-width="2.5" />
    <rect x="6" y="8" width="128" height="254" rx="18" fill="#0B0E14" />
    
    <!-- Notch -->
    <rect x="45" y="12" width="50" height="9" rx="4.5" fill="#1A202C" />

    <!-- Topo do Restaurante / Banner -->
    <g transform="translate(12, 28)">
      <rect x="0" y="0" width="116" height="42" rx="8" fill="#1C2330" stroke="#283548" stroke-width="0.8" />
      <circle cx="24" cy="21" r="12" fill="#0A84FF" fill-opacity="0.2" />
      <path d="M19 21 C19 17 29 17 29 21 Z M18 22 H30" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" />
      <rect x="44" y="14" width="55" height="6" rx="3" fill="#FFFFFF" />
      <rect x="44" y="24" width="35" height="4" rx="2" fill="#25D366" />
    </g>

    <!-- Categorias do Cardápio (Pills) -->
    <g transform="translate(12, 76)">
      <rect x="0" y="0" width="34" height="14" rx="7" fill="#0A84FF" />
      <rect x="38" y="0" width="36" height="14" rx="7" fill="#1C2330" />
      <rect x="78" y="0" width="36" height="14" rx="7" fill="#1C2330" />
    </g>

    <!-- Item do Cardápio 1 -->
    <g transform="translate(12, 98)">
      <rect x="0" y="0" width="116" height="44" rx="8" fill="#141822" stroke="#222B3A" stroke-width="0.8" />
      <rect x="8" y="8" width="28" height="28" rx="6" fill="#1E2736" />
      <circle cx="22" cy="22" r="7" fill="#0A84FF" fill-opacity="0.3" />
      <rect x="42" y="10" width="50" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.9" />
      <rect x="42" y="18" width="60" height="4" rx="2" fill="#6B7280" />
      <rect x="42" y="27" width="26" height="6" rx="3" fill="#25D366" />
      <circle cx="102" cy="30" r="6" fill="#0A84FF" />
      <path d="M99 30 H105 M102 27 V33" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Item do Cardápio 2 -->
    <g transform="translate(12, 148)">
      <rect x="0" y="0" width="116" height="44" rx="8" fill="#141822" stroke="#222B3A" stroke-width="0.8" />
      <rect x="8" y="8" width="28" height="28" rx="6" fill="#1E2736" />
      <circle cx="22" cy="22" r="7" fill="#0A84FF" fill-opacity="0.3" />
      <rect x="42" y="10" width="45" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.9" />
      <rect x="42" y="18" width="55" height="4" rx="2" fill="#6B7280" />
      <rect x="42" y="27" width="26" height="6" rx="3" fill="#25D366" />
      <circle cx="102" cy="30" r="6" fill="#0A84FF" />
      <path d="M99 30 H105 M102 27 V33" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Botão de Ver Sacola / Pedir no WhatsApp (Flutuante no App) -->
    <g transform="translate(12, 202)">
      <rect x="0" y="0" width="116" height="26" rx="8" fill="#25D366" />
      <rect x="25" y="9" width="50" height="6" rx="3" fill="#FFFFFF" />
      <circle cx="15" cy="13" r="4" fill="#FFFFFF" fill-opacity="0.3" />
      <circle cx="95" cy="13" r="7" fill="#1E9E4B" />
      <rect x="91" y="11" width="8" height="4" rx="2" fill="#FFFFFF" />
    </g>

    <!-- Barra de navegação inferior -->
    <rect x="48" y="254" width="44" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- Elemento Flutuante à Esquerda (Comprovante / Notificação de Pedido) -->
  <g transform="translate(30, 90)" filter="url(#pShadow3)">
    <rect x="0" y="0" width="125" height="60" rx="10" fill="#151A24" stroke="#273244" stroke-width="1" />
    <circle cx="22" cy="25" r="10" fill="#25D366" fill-opacity="0.2" />
    <path d="M18 25 L21 28 L27 22" stroke="#25D366" stroke-width="2" stroke-linecap="round" />
    <rect x="38" y="18" width="65" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="38" y="28" width="45" height="5" rx="2.5" fill="#0A84FF" />
    <rect x="15" y="44" width="95" height="4" rx="2" fill="#4B5565" />
  </g>

  <!-- Elemento Flutuante à Direita (Agilidade de Atendimento) -->
  <g transform="translate(325, 130)" filter="url(#pShadow3)">
    <rect x="0" y="0" width="125" height="60" rx="10" fill="#151A24" stroke="#273244" stroke-width="1" />
    <circle cx="22" cy="25" r="10" fill="#0A84FF" fill-opacity="0.2" />
    <path d="M22 19 V25 L26 27" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round" />
    <rect x="38" y="18" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="38" y="28" width="50" height="5" rx="2.5" fill="#27C93F" />
    <rect x="15" y="44" width="95" height="4" rx="2" fill="#4B5565" />
  </g>
</svg>

