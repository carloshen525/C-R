<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradientes de Marca e Efeitos -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0A84FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389BFF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="blueGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232B" />
      <stop offset="100%" stop-color="#12151A" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B35" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <linearGradient id="accentCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#12161F" />
    </linearGradient>

    <!-- Filtros de Sombra Suave -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A84FF" flood-opacity="0.22" />
    </filter>
    <filter id="floatGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0A84FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo Sutil de Brilho Dinâmico -->
  <circle cx="360" cy="270" r="260" fill="url(#bgGlow)" />
  <circle cx="560" cy="180" r="140" fill="#0A84FF" fill-opacity="0.08" filter="blur(40px)" />
  
  <!-- Grid decorativo minimalista -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 6">
    <line x1="80" y1="120" x2="640" y2="120" />
    <line x1="80" y1="240" x2="640" y2="240" />
    <line x1="80" y1="360" x2="640" y2="360" />
    <line x1="180" y1="60" x2="180" y2="480" />
    <line x1="360" y1="60" x2="360" y2="480" />
    <line x1="540" y1="60" x2="540" y2="480" />
  </g>

  <!-- ================= NOTEBOOK PRINCIPAL ================= -->
  <g filter="url(#softShadow)">
    <!-- Base do Notebook (Atrás) -->
    <rect x="130" y="80" width="460" height="300" rx="18" fill="url(#laptopBody)" stroke="#2D3542" stroke-width="2" />
    
    <!-- Tela do Notebook -->
    <rect x="146" y="96" width="428" height="268" rx="10" fill="url(#screenGrad)" />
    
    <!-- Barra Superior da Janela / Dashboard (3 pontinhos minimalistas) -->
    <rect x="146" y="96" width="428" height="26" rx="10" fill="#141820" />
    <circle cx="164" cy="109" r="4" fill="#FF5F56" />
    <circle cx="178" cy="109" r="4" fill="#FFBD2E" />
    <circle cx="192" cy="109" r="4" fill="#27C93F" />
    <!-- Barrinha de endereço sutil -->
    <rect x="220" y="103" width="160" height="12" rx="6" fill="#202733" />
    <circle cx="230" cy="109" r="2.5" fill="#0A84FF" />

    <!-- Conteúdo da Tela do Notebook: DASHBOARD DE MARKETING & VENDAS -->
    <!-- Coluna Esquerda: Métricas Rápidas -->
    <g transform="translate(162, 134)">
      <!-- Mini Card 1 -->
      <rect x="0" y="0" width="114" height="64" rx="8" fill="#151A22" stroke="#222A36" stroke-width="1" />
      <circle cx="20" cy="22" r="9" fill="#0A84FF" fill-opacity="0.15" />
      <path d="M16 22 L19 25 L25 18" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="36" y="17" width="56" height="7" rx="3.5" fill="#4B5565" />
      <rect x="14" y="42" width="70" height="12" rx="4" fill="#FFFFFF" fill-opacity="0.9" />

      <!-- Mini Card 2 -->
      <rect x="0" y="74" width="114" height="64" rx="8" fill="#151A22" stroke="#222A36" stroke-width="1" />
      <circle cx="20" cy="96" r="9" fill="#27C93F" fill-opacity="0.15" />
      <path d="M16 99 L20 93 L24 97" stroke="#27C93F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="36" y="91" width="48" height="7" rx="3.5" fill="#4B5565" />
      <rect x="14" y="116" width="60" height="12" rx="4" fill="#FFFFFF" fill-opacity="0.9" />

      <!-- Mini Card 3 -->
      <rect x="0" y="148" width="114" height="68" rx="8" fill="#151A22" stroke="#222A36" stroke-width="1" />
      <circle cx="20" cy="170" r="9" fill="#FFBD2E" fill-opacity="0.15" />
      <circle cx="20" cy="170" r="4" stroke="#FFBD2E" stroke-width="2" />
      <rect x="36" y="165" width="52" height="7" rx="3.5" fill="#4B5565" />
      <rect x="14" y="190" width="74" height="12" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    </g>

    <!-- Área Central/Direita da Tela: GRÁFICO PRINCIPAL DE CRESCIMENTO -->
    <g transform="translate(290, 134)">
      <rect x="0" y="0" width="268" height="216" rx="10" fill="#12161F" stroke="#202734" stroke-width="1" />
      
      <!-- Cabeçalho do Gráfico -->
      <circle cx="22" cy="24" r="8" fill="#0A84FF" />
      <rect x="38" y="20" width="90" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85" />
      <rect x="212" y="18" width="42" height="14" rx="7" fill="#0A84FF" fill-opacity="0.2" />
      <circle cx="233" cy="25" r="3" fill="#0A84FF" />

      <!-- Linhas de Apoio do Gráfico -->
      <line x1="20" y1="70" x2="248" y2="70" stroke="#1E2633" stroke-width="1" />
      <line x1="20" y1="110" x2="248" y2="110" stroke="#1E2633" stroke-width="1" />
      <line x1="20" y1="150" x2="248" y2="150" stroke="#1E2633" stroke-width="1" />
      <line x1="20" y1="190" x2="248" y2="190" stroke="#242F40" stroke-width="1.5" />

      <!-- Barras de Volume Minimalistas -->
      <rect x="34" y="152" width="14" height="38" rx="4" fill="#1D2636" />
      <rect x="64" y="132" width="14" height="58" rx="4" fill="#1D2636" />
      <rect x="94" y="120" width="14" height="70" rx="4" fill="#1D2636" />
      <rect x="124" y="104" width="14" height="86" rx="4" fill="#1F2E44" />
      <rect x="154" y="86" width="14" height="104" rx="4" fill="#0A84FF" fill-opacity="0.3" />
      <rect x="184" y="68" width="14" height="122" rx="4" fill="#0A84FF" fill-opacity="0.5" />
      <rect x="214" y="48" width="14" height="142" rx="4" fill="url(#blueGrad)" />

      <!-- Área de Preenchimento da Curva de Vendas / Crescimento -->
      <path d="M 38 160 Q 90 146 130 112 T 222 52 L 222 190 L 38 190 Z" fill="url(#blueGlowGrad)" />
      
      <!-- Linha de Curva Ascendente de Alta Performance -->
      <path d="M 38 160 Q 90 146 130 112 T 222 52" fill="none" stroke="#389BFF" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Marcador no Ponto Mais Alto do Gráfico -->
      <circle cx="222" cy="52" r="7" fill="#0A84FF" />
      <circle cx="222" cy="52" r="3" fill="#FFFFFF" />

      <!-- Badge de Pico de Vendas Flutuante -->
      <g transform="translate(150, 20)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#0A84FF" />
        <path d="M12 11 L18 6 L24 11 M18 7 L18 16" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="42" cy="11" r="3" fill="#FFFFFF" />
        <rect x="34" y="8" width="18" height="6" rx="3" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Base / Teclado do Notebook (Parte Inferior Frontal) -->
    <path d="M 70 380 L 130 380 L 590 380 L 650 380 C 655 380 660 386 654 394 L 620 422 C 616 426 610 428 604 428 L 116 428 C 110 428 104 426 100 422 L 66 394 C 60 386 65 380 70 380 Z" fill="#1C212A" stroke="#2D3544" stroke-width="1.5" />
    <!-- Entalhe do Trackpad -->
    <rect x="310" y="383" width="100" height="6" rx="3" fill="#0E1217" />
    <!-- Luz sutil na borda frontal -->
    <line x1="120" y1="427" x2="600" y2="427" stroke="#0A84FF" stroke-width="1.5" stroke-opacity="0.6" />
  </g>

  <!-- ================= SMARTPHONE (MOBILE FIRST) ================= -->
  <g transform="translate(430, 200)" filter="url(#floatGlow)">
    <!-- Corpo do Celular -->
    <rect x="0" y="0" width="180" height="300" rx="32" fill="url(#phoneBody)" stroke="#384355" stroke-width="3" />
    <!-- Tela do Celular -->
    <rect x="8" y="10" width="164" height="280" rx="24" fill="#0A0D12" />
    
    <!-- Notch / Dynamic Island -->
    <rect x="62" y="16" width="56" height="12" rx="6" fill="#181F2A" />
    <circle cx="106" cy="22" r="2.5" fill="#0A84FF" />

    <!-- Conteúdo do Celular: ANÚNCIO NO META ADS / FEED DE ALTA CONVERSÃO -->
    <!-- Header do Perfil / Anúncio -->
    <g transform="translate(18, 38)">
      <circle cx="14" cy="14" r="14" fill="#0A84FF" />
      <!-- Ícone estético dentro do avatar -->
      <path d="M10 14 L13 17 L19 11" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="36" y="6" width="68" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.9" />
      <rect x="36" y="17" width="42" height="5" rx="2.5" fill="#0A84FF" />
      <circle cx="134" cy="14" r="2" fill="#6B788E" />
      <circle cx="139" cy="14" r="2" fill="#6B788E" />
      <circle cx="144" cy="14" r="2" fill="#6B788E" />
    </g>

    <!-- Card de Mídia do Anúncio (Imagem de Alta Performance) -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="144" height="106" rx="10" fill="url(#accentCard)" stroke="#232B39" stroke-width="1" />
      <!-- Gráfico vetorial interno no card do anúncio -->
      <circle cx="72" cy="46" r="28" fill="#0A84FF" fill-opacity="0.12" />
      <path d="M46 62 L62 44 L78 52 L98 32" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="98" cy="32" r="4.5" fill="#389BFF" />
      <!-- Barras decorativas do card -->
      <rect x="12" y="86" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
      <rect x="12" y="95" width="46" height="4" rx="2" fill="#4B5565" />
    </g>

    <!-- Botão de Ação do Anúncio (Simulação do CTA WhatsApp / Conversão) -->
    <g transform="translate(18, 190)">
      <rect x="0" y="0" width="144" height="30" rx="8" fill="url(#blueGrad)" />
      <!-- Linhas estéticas do botão -->
      <rect x="32" y="11" width="60" height="8" rx="4" fill="#FFFFFF" />
      <!-- Ícone de seta / envio -->
      <path d="M102 15 L112 15 M108 11 L112 15 L108 19" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Interações do Feed (Likes, Compartilhamentos, Conversões) -->
    <g transform="translate(24, 230)">
      <circle cx="10" cy="10" r="8" fill="#1E2633" />
      <path d="M6 10 L9 13 L15 7" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" />
      
      <circle cx="34" cy="10" r="8" fill="#1E2633" />
      <rect x="30" y="7" width="8" height="6" rx="2" stroke="#0A84FF" stroke-width="1.5" fill="none" />

      <circle cx="58" cy="10" r="8" fill="#1E2633" />
      <path d="M54 10 L62 10" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" />

      <rect x="80" y="8" width="48" height="5" rx="2.5" fill="#384355" />
    </g>

    <!-- Barra de Navegação Inferior do Celular -->
    <rect x="58" y="278" width="64" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4" />
  </g>

  <!-- ================= ELEMENTOS FLUTUANTES DE CRESCIMENTO ================= -->
  
  <!-- Card Flutuante 1: Notificação de Lead / Conversão (Esquerda Superior) -->
  <g transform="translate(60, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="148" height="58" rx="14" fill="#12161F" stroke="#252F40" stroke-width="1.5" />
    <circle cx="28" cy="29" r="15" fill="#0A84FF" fill-opacity="0.2" />
    <!-- Ícone de mensagem / WhatsApp / Lead -->
    <path d="M22 33 L24 29 C23 27 23 25 24 23 C26 21 29 20 32 21 C35 22 36 25 35 28 C34 30 31 32 29 32 L25 33 Z" fill="#0A84FF" />
    <rect x="52" y="20" width="68" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="52" y="32" width="46" height="6" rx="3" fill="#27C93F" />
  </g>

  <!-- Card Flutuante 2: Gráfico Circular / ROI (Direita Superior) -->
  <g transform="translate(540, 70)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="130" height="70" rx="14" fill="#12161F" stroke="#252F40" stroke-width="1.5" />
    <!-- Donut Chart -->
    <circle cx="34" cy="35" r="18" stroke="#1D2636" stroke-width="6" fill="none" />
    <circle cx="34" cy="35" r="18" stroke="#0A84FF" stroke-width="6" stroke-dasharray="82 32" stroke-dashoffset="18" stroke-linecap="round" fill="none" />
    <!-- Seta de Tendência Alta -->
    <circle cx="34" cy="35" r="5" fill="#FFFFFF" />
    <rect x="64" y="24" width="50" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="64" y="38" width="36" height="6" rx="3" fill="#0A84FF" />
  </g>

  <!-- Card Flutuante 3: Seta 3D Dinâmica de Crescimento Exponencial (Esquerda Inferior) -->
  <g transform="translate(100, 360)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="110" height="64" rx="14" fill="#12161F" stroke="#252F40" stroke-width="1.5" />
    <!-- Seta Ascendente Estilizada -->
    <path d="M24 46 L46 24 M46 24 H30 M46 24 V40" stroke="#0A84FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="58" y="24" width="38" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="58" y="36" width="28" height="5" rx="2.5" fill="#389BFF" />
  </g>
</svg>

