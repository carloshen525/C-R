<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26" />
      <stop offset="100%" stop-color="#0E1218" />
    </linearGradient>
    <linearGradient id="blueGlowAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0056B3" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2633" />
      <stop offset="100%" stop-color="#141922" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="shadowAbout" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowAboutCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0A84FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Fundo com Cantos Arredondados e Moldura Elegante -->
  <rect x="10" y="10" width="580" height="480" rx="28" fill="url(#aboutBg)" stroke="#232B38" stroke-width="2" />
  
  <!-- Círculos de Iluminação de Estúdio no Fundo -->
  <circle cx="480" cy="120" r="140" fill="#0A84FF" fill-opacity="0.12" filter="blur(50px)" />
  <circle cx="120" cy="380" r="100" fill="#0A84FF" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Padrão geométrico sutil de fundo (tech/business) -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <circle cx="300" cy="220" r="160" fill="none" stroke-dasharray="6 6" />
    <circle cx="300" cy="220" r="190" fill="none" />
    <line x1="140" y1="220" x2="460" y2="220" />
    <line x1="300" y1="60" x2="300" y2="380" />
  </g>

  <!-- Ilustração Estilizada do Fundador / Especialista C&R Marketing -->
  <g filter="url(#shadowAbout)">
    <!-- Base / Ombros e Paletó Moderno -->
    <path d="M170 490 C170 380 230 330 300 330 C370 330 430 380 430 490 Z" fill="url(#suitGrad)" stroke="#2C3545" stroke-width="1.5" />
    
    <!-- Gola da Camisa / Camiseta Moderna -->
    <path d="M265 330 L300 385 L335 330 Z" fill="url(#shirtGrad)" />
    <!-- Lapela do Paletó -->
    <path d="M250 330 L285 410 L300 490" stroke="#0A84FF" stroke-width="2" fill="none" stroke-opacity="0.6" />
    <path d="M350 330 L315 410 L300 490" stroke="#0A84FF" stroke-width="2" fill="none" stroke-opacity="0.6" />

    <!-- Pescoço -->
    <path d="M272 260 H328 V340 C328 348 316 354 300 354 C284 354 272 348 272 340 Z" fill="#E2B997" />

    <!-- Cabeça / Rosto -->
    <path d="M245 200 C245 130 355 130 355 200 C355 255 335 285 300 285 C265 285 245 255 245 200 Z" fill="#F0C7A6" />
    
    <!-- Cabelo Moderno e Alinhado -->
    <path d="M240 185 C240 120 285 95 330 95 C355 95 365 110 365 135 C365 145 360 155 355 160 C350 140 330 115 295 115 C265 115 250 145 245 185 Z" fill="#1C212A" />
    <path d="M242 185 C240 150 260 110 315 105 C345 102 362 118 362 135 C350 125 330 118 305 120 C270 122 250 148 245 190 Z" fill="#2A3240" />

    <!-- Barba Moderna e Bem Aparada -->
    <path d="M252 220 C252 260 270 285 300 285 C330 285 348 260 348 220 C348 238 335 272 300 272 C265 272 252 238 252 220 Z" fill="#1C212A" opacity="0.85" />

    <!-- Óculos Modernos Tech / Minimalistas -->
    <rect x="256" y="180" width="36" height="24" rx="7" fill="none" stroke="#0A84FF" stroke-width="2.5" />
    <rect x="308" y="180" width="36" height="24" rx="7" fill="none" stroke="#0A84FF" stroke-width="2.5" />
    <line x1="292" y1="190" x2="308" y2="190" stroke="#0A84FF" stroke-width="2.5" />
    <line x1="246" y1="188" x2="256" y2="188" stroke="#0A84FF" stroke-width="2" />
    <line x1="344" y1="188" x2="354" y2="188" stroke="#0A84FF" stroke-width="2" />
    <!-- Brilho no óculos -->
    <line x1="262" y1="184" x2="276" y2="198" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <line x1="314" y1="184" x2="328" y2="198" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- ================= ELEMENTOS FLUTUANTES DE AUTORIDADE ================= -->

  <!-- Badge 1: Estratégias & Crescimento (Canto Superior Direito) -->
  <g transform="translate(370, 50)" filter="url(#glowAboutCard)">
    <rect x="0" y="0" width="190" height="64" rx="14" fill="#151A23" stroke="#2D3748" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#0A84FF" fill-opacity="0.15" />
    <path d="M24 36 L30 28 L34 32 L40 24" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="58" y="22" width="100" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="58" y="36" width="65" height="6" rx="3" fill="#0A84FF" />
  </g>

  <!-- Badge 2: Atendimento Próximo & Parceria (Canto Inferior Esquerdo) -->
  <g transform="translate(35, 370)" filter="url(#glowAboutCard)">
    <rect x="0" y="0" width="180" height="64" rx="14" fill="#151A23" stroke="#2D3748" stroke-width="1.5" />
    <circle cx="32" cy="32" r="16" fill="#25D366" fill-opacity="0.15" />
    <!-- Ícone de Aperto de mão / Parceria -->
    <path d="M24 30 L28 26 C30 24 33 24 35 26 L38 29 M32 34 L36 38 C38 40 41 40 43 38" stroke="#25D366" stroke-width="2" stroke-linecap="round" />
    <rect x="58" y="22" width="95" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="58" y="36" width="60" height="6" rx="3" fill="#25D366" />
  </g>

  <!-- Selo C&R Oficial no Canto -->
  <g transform="translate(490, 410)">
    <circle cx="30" cy="30" r="26" fill="#12161F" stroke="#0A84FF" stroke-width="2" />
    <circle cx="30" cy="30" r="21" fill="none" stroke="#2A3546" stroke-width="1" stroke-dasharray="3 3" />
    <path d="M22 28 C20 28 18 30 18 32 C18 34 20 36 22 36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M34 36 V28 H38 C40 28 41 29 41 31 C41 33 40 34 38 34 H34 M38 34 L41 36" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

