<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="projBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="projBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#005ecb" />
    </linearGradient>
    <filter id="pShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo do Card de Mockup -->
  <rect width="480" height="300" rx="14" fill="url(#projBg1)" />
  <circle cx="240" cy="150" r="130" fill="#0A84FF" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Mockup do Laptop (Desktop Site) -->
  <g transform="translate(45, 30)" filter="url(#pShadow1)">
    <!-- Tela -->
    <rect x="30" y="10" width="290" height="185" rx="10" fill="#181D26" stroke="#2A3444" stroke-width="1.5" />
    <!-- Display -->
    <rect x="38" y="24" width="274" height="163" rx="6" fill="#0E1218" />
    <!-- Barra superior do browser -->
    <rect x="38" y="24" width="274" height="16" rx="6" fill="#161B22" />
    <circle cx="48" cy="32" r="2.5" fill="#FF5F56" />
    <circle cx="56" cy="32" r="2.5" fill="#FFBD2E" />
    <circle cx="64" cy="32" r="2.5" fill="#27C93F" />
    <rect x="80" y="28" width="90" height="8" rx="4" fill="#222A36" />

    <!-- Conteúdo do Site no Laptop -->
    <!-- Header do site cliente -->
    <rect x="46" y="46" width="30" height="6" rx="3" fill="#0A84FF" />
    <rect x="180" y="47" width="20" height="4" rx="2" fill="#4B5565" />
    <rect x="208" y="47" width="20" height="4" rx="2" fill="#4B5565" />
    <rect x="236" y="47" width="20" height="4" rx="2" fill="#4B5565" />
    <rect x="264" y="45" width="40" height="8" rx="4" fill="#0A84FF" />

    <!-- Hero do site cliente -->
    <rect x="46" y="66" width="120" height="12" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="46" y="82" width="100" height="8" rx="3" fill="#6B7280" />
    <rect x="46" y="94" width="80" height="6" rx="3" fill="#4B5565" />
    <rect x="46" y="108" width="55" height="12" rx="6" fill="#0A84FF" />

    <!-- Imagem/Banner Hero do site cliente -->
    <rect x="175" y="66" width="128" height="64" rx="8" fill="#1C2330" stroke="#293547" stroke-width="1" />
    <circle cx="239" cy="98" r="16" fill="#0A84FF" fill-opacity="0.2" />
    <path d="M225 106 L235 94 L245 100 L253 90" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" />

    <!-- 3 Cards de Serviços do site cliente -->
    <rect x="46" y="138" width="76" height="42" rx="6" fill="#151A22" stroke="#222A36" stroke-width="0.8" />
    <rect x="52" y="144" width="14" height="14" rx="3" fill="#0A84FF" fill-opacity="0.25" />
    <rect x="52" y="162" width="45" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="52" y="170" width="60" height="4" rx="2" fill="#4B5565" />

    <rect x="130" y="138" width="76" height="42" rx="6" fill="#151A22" stroke="#222A36" stroke-width="0.8" />
    <rect x="136" y="144" width="14" height="14" rx="3" fill="#0A84FF" fill-opacity="0.25" />
    <rect x="136" y="162" width="45" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="136" y="170" width="60" height="4" rx="2" fill="#4B5565" />

    <rect x="214" y="138" width="76" height="42" rx="6" fill="#151A22" stroke="#222A36" stroke-width="0.8" />
    <rect x="220" y="144" width="14" height="14" rx="3" fill="#0A84FF" fill-opacity="0.25" />
    <rect x="220" y="162" width="45" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="220" y="170" width="60" height="4" rx="2" fill="#4B5565" />

    <!-- Base do Laptop -->
    <path d="M0 195 L350 195 C355 195 358 198 355 203 L340 216 C337 219 333 220 328 220 L22 220 C17 220 13 219 10 216 L-5 203 C-8 198 -5 195 0 195 Z" fill="#1F2633" stroke="#2A3546" stroke-width="1.2" />
    <rect x="150" y="197" width="50" height="4" rx="2" fill="#0E1218" />
  </g>

  <!-- Mockup do Celular (Mobile Responsivo) -->
  <g transform="translate(325, 95)" filter="url(#pShadow1)">
    <rect x="0" y="0" width="105" height="175" rx="18" fill="#181D26" stroke="#3A4659" stroke-width="2" />
    <rect x="5" y="6" width="95" height="163" rx="14" fill="#0B0E14" />
    <!-- Notch -->
    <rect x="35" y="10" width="35" height="7" rx="3.5" fill="#1A202A" />

    <!-- Conteúdo Mobile -->
    <rect x="12" y="24" width="22" height="5" rx="2.5" fill="#0A84FF" />
    <rect x="80" y="24" width="14" height="6" rx="2" fill="#222A36" />
    <rect x="12" y="38" width="75" height="9" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="12" y="50" width="55" height="6" rx="2" fill="#6B7280" />
    <rect x="12" y="62" width="81" height="40" rx="6" fill="#19202B" stroke="#273344" stroke-width="0.8" />
    <circle cx="52" cy="82" r="10" fill="#0A84FF" fill-opacity="0.25" />
    <rect x="12" y="110" width="81" height="12" rx="4" fill="#0A84FF" />
    <rect x="12" y="130" width="81" height="30" rx="6" fill="#151A22" stroke="#222A36" stroke-width="0.8" />
    <!-- Barra inferior -->
    <rect x="38" y="163" width="30" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>
</svg>

