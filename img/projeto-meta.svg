<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="projBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="metaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>
    <filter id="pShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect width="480" height="300" rx="14" fill="url(#projBg2)" />
  <circle cx="240" cy="150" r="130" fill="#1877F2" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Janela de Gerenciador de Anúncios Meta Ads (Fundo) -->
  <g transform="translate(30, 25)" filter="url(#pShadow2)">
    <rect x="0" y="0" width="280" height="235" rx="10" fill="#141820" stroke="#252F3F" stroke-width="1.5" />
    <!-- Header da Janela -->
    <rect x="0" y="0" width="280" height="24" rx="10" fill="#19202B" />
    <circle cx="16" cy="12" r="3" fill="#FF5F56" />
    <circle cx="26" cy="12" r="3" fill="#FFBD2E" />
    <circle cx="36" cy="12" r="3" fill="#27C93F" />
    <rect x="55" y="8" width="80" height="8" rx="4" fill="#232B38" />

    <!-- Tabela / Linhas de Campanhas Ativas -->
    <rect x="15" y="38" width="70" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="210" y="36" width="55" height="12" rx="4" fill="#27C93F" fill-opacity="0.2" />
    <circle cx="220" cy="42" r="2.5" fill="#27C93F" />
    <rect x="228" y="39" width="30" height="6" rx="3" fill="#27C93F" />

    <!-- Métricas da Campanha -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="115" height="50" rx="6" fill="#1B222D" stroke="#263142" stroke-width="0.8" />
      <rect x="10" y="10" width="45" height="5" rx="2.5" fill="#6B7280" />
      <rect x="10" y="24" width="65" height="10" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
      <circle cx="95" cy="25" r="9" fill="#0A84FF" fill-opacity="0.2" />
      <path d="M91 27 L94 23 L98 25" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" />

      <rect x="130" y="0" width="120" height="50" rx="6" fill="#1B222D" stroke="#263142" stroke-width="0.8" />
      <rect x="140" y="10" width="55" height="5" rx="2.5" fill="#6B7280" />
      <rect x="140" y="24" width="75" height="10" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
      <circle cx="230" cy="25" r="9" fill="#27C93F" fill-opacity="0.2" />
      <path d="M226 27 L229 23 L233 25" stroke="#27C93F" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Gráfico de Conversão / Leads em Linhas -->
    <g transform="translate(15, 125)">
      <rect x="0" y="0" width="250" height="95" rx="6" fill="#11151D" stroke="#1F2837" stroke-width="0.8" />
      <line x1="15" y1="75" x2="235" y2="75" stroke="#1F2837" stroke-width="1" />
      <line x1="15" y1="45" x2="235" y2="45" stroke="#1F2837" stroke-width="1" />
      <line x1="15" y1="15" x2="235" y2="15" stroke="#1F2837" stroke-width="1" />

      <!-- Curva de Crescimento Meta Ads -->
      <path d="M 20 65 Q 60 60 100 45 T 180 25 T 235 12" fill="none" stroke="url(#metaBlue)" stroke-width="3" stroke-linecap="round" />
      <circle cx="235" cy="12" r="4" fill="#0A84FF" />
      <circle cx="235" cy="12" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Card de Anúncio / Criativo Patrocinado (Sobreposto à Direita) -->
  <g transform="translate(285, 45)" filter="url(#pShadow2)">
    <rect x="0" y="0" width="165" height="225" rx="14" fill="#1A202A" stroke="#2D3748" stroke-width="2" />
    
    <!-- Cabeçalho do Anúncio (Foto de Perfil + Nome + "Patrocinado") -->
    <circle cx="22" cy="24" r="10" fill="#0A84FF" />
    <path d="M19 24 L21 26 L26 21" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <rect x="38" y="18" width="55" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="38" y="27" width="35" height="4" rx="2" fill="#0A84FF" />
    <circle cx="145" cy="24" r="1.8" fill="#6B7280" />
    <circle cx="150" cy="24" r="1.8" fill="#6B7280" />

    <!-- Texto do Post -->
    <rect x="12" y="42" width="140" height="5" rx="2.5" fill="#9CA3AF" />
    <rect x="12" y="50" width="90" height="5" rx="2.5" fill="#9CA3AF" />

    <!-- Imagem / Arte do Criativo -->
    <rect x="12" y="62" width="141" height="98" rx="8" fill="#121620" stroke="#263040" stroke-width="1" />
    <circle cx="82" cy="102" r="22" fill="#0A84FF" fill-opacity="0.2" />
    <path d="M60 120 L75 95 L95 105 L110 85" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" />
    <rect x="22" y="138" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="22" y="148" width="50" height="4" rx="2" fill="#4B5565" />

    <!-- Botão de Ação do Anúncio (CTA WhatsApp) -->
    <rect x="12" y="168" width="141" height="26" rx="6" fill="#0A84FF" />
    <rect x="38" y="178" width="55" height="6" rx="3" fill="#FFFFFF" />
    <path d="M102 181 L110 181 M107 178 L110 181 L107 184" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Curtidas e Compartilhamentos -->
    <circle cx="22" cy="207" r="5" fill="#25D366" />
    <rect x="34" y="205" width="45" height="4" rx="2" fill="#6B7280" />
  </g>
</svg>

