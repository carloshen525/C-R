<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="projBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <filter id="pShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo do Card -->
  <rect width="480" height="300" rx="14" fill="url(#projBg4)" />
  <circle cx="240" cy="150" r="130" fill="#0A84FF" fill-opacity="0.08" filter="blur(30px)" />

  <!-- Janela de Busca Google (Desktop & Top Ranking) -->
  <g transform="translate(45, 25)" filter="url(#pShadow4)">
    <rect x="0" y="0" width="390" height="245" rx="12" fill="#141822" stroke="#283446" stroke-width="1.5" />
    
    <!-- Barra Superior da Janela -->
    <rect x="0" y="0" width="390" height="36" rx="12" fill="#181F2C" />
    <circle cx="18" cy="18" r="3.5" fill="#FF5F56" />
    <circle cx="30" cy="18" r="3.5" fill="#FFBD2E" />
    <circle cx="42" cy="18" r="3.5" fill="#27C93F" />

    <!-- Barra de Pesquisa do Google -->
    <g transform="translate(65, 8)">
      <rect x="0" y="0" width="260" height="20" rx="10" fill="#0F131A" stroke="#252F40" stroke-width="1" />
      <circle cx="14" cy="10" r="4.5" fill="none" stroke="#6B7280" stroke-width="1.2" />
      <line x1="17.5" y1="13.5" x2="20" y2="16" stroke="#6B7280" stroke-width="1.2" />
      <rect x="28" y="7" width="105" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    </g>

    <!-- Resultado Patrocinado #1 (Google Ads Top 1) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="350" height="84" rx="8" fill="#1A212E" stroke="#0A84FF" stroke-width="1" />
      <!-- Tag Patrocinado -->
      <rect x="14" y="12" width="60" height="14" rx="3" fill="#0A84FF" fill-opacity="0.2" />
      <rect x="22" y="16" width="44" height="6" rx="3" fill="#0A84FF" />
      
      <!-- URL / Domínio -->
      <rect x="82" y="16" width="70" height="6" rx="3" fill="#6B7280" />

      <!-- Título do Anúncio (Azul Google) -->
      <rect x="14" y="34" width="220" height="10" rx="4" fill="#389BFF" />
      
      <!-- Descrição do Anúncio -->
      <rect x="14" y="50" width="310" height="6" rx="3" fill="#9CA3AF" />
      <rect x="14" y="60" width="230" height="6" rx="3" fill="#6B7280" />

      <!-- Sitelinks Patrocinados -->
      <rect x="14" y="72" width="70" height="5" rx="2.5" fill="#0A84FF" />
      <rect x="94" y="72" width="80" height="5" rx="2.5" fill="#0A84FF" />
    </g>

    <!-- Resultado Orgânico #2 (Abaixo do Anúncio) -->
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="350" height="50" rx="8" fill="#11151D" stroke="#1D2533" stroke-width="0.8" />
      <rect x="14" y="10" width="70" height="5" rx="2.5" fill="#4B5565" />
      <rect x="14" y="20" width="180" height="8" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
      <rect x="14" y="34" width="260" height="5" rx="2.5" fill="#6B7280" />
    </g>

    <!-- Badge de Alta Intenção de Compra (Flutuante no Canto Inferior) -->
    <g transform="translate(220, 198)" filter="url(#pShadow4)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#0A84FF" />
      <circle cx="16" cy="17" r="8" fill="#FFFFFF" fill-opacity="0.2" />
      <path d="M12 17 L15 20 L21 14" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <rect x="32" y="12" width="85" height="5" rx="2.5" fill="#FFFFFF" />
      <rect x="32" y="19" width="60" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    </g>
  </g>
</svg>

